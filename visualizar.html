<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b91c1c">
  <title>Escala de Serviço - CCI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .tabela-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { min-width: max-content; }
    th, td { white-space: nowrap; }
    .celula-militar { min-width: 150px; white-space: normal; }
    .militar-nome { display: block; font-weight: 600; }
    .militar-nome.escala-vermelha { color: #dc2626 !important; }
    /* Cores da escala Web: troca #ccff00; militar puxado #fca5a5. */
    .celula-militar[style*="#fca5a5"] .militar-nome.escala-vermelha { color: #991b1b !important; }
    .tabela-dia { min-width: 0; width: 100%; max-width: 780px; margin: 0 auto; }
    .tabela-dia th, .tabela-dia td { white-space: normal; }
    .tabela-dia .celula-militar { min-width: 0; }
    .pdf-exportacao .tabela-dia { width: 780px; min-width: 780px; }
    .pdf-exportacao .tabela-dia th, .pdf-exportacao .tabela-dia td { white-space: normal; }
    .militar-saram { display: block; margin-top: 2px; font-size: 0.9em; font-weight: 400; color: #4b5563; }
    /* A visualização permanece rolável; somente a cópia do PDF é expandida. */
    .pdf-exportacao table { min-width: max-content; width: max-content; }
    .pdf-exportacao th, .pdf-exportacao td { white-space: nowrap; }
    .pdf-exportacao .celula-militar { white-space: normal; }

  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
  <main class="mx-auto max-w-[1600px] p-3 md:p-6">
    <header class="mb-4 rounded-lg bg-white p-4 shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-xl font-bold text-red-700">Escala de Serviço - CCI</h1>
          <p id="mesPublicacao" class="mt-1 text-sm font-semibold text-gray-700">Carregando escala...</p>
          <p id="ultimaAtualizacao" class="mt-1 text-xs text-gray-500"></p>
        </div>
        <div class="flex flex-wrap items-end gap-2">
          <label class="text-xs font-semibold text-gray-600">
            Escala
            <select id="seletorEscala" class="mt-1 min-w-[190px] rounded border border-gray-300 bg-white px-3 py-2 text-sm text-gray-800"
                    onchange="carregarEscalaPublicada(this.value)">
              <option value="">Carregando...</option>
            </select>
          </label>
          <label class="text-xs font-semibold text-gray-600">
            Dia da escala
            <select id="seletorDia" class="mt-1 min-w-[155px] rounded border border-gray-300 bg-white px-3 py-2 text-sm text-gray-800" onchange="filtrarDiaEscala()" disabled>
              <option value="">Mês completo</option>
            </select>
          </label>
          <label class="text-xs font-semibold text-gray-600">
            Exibir função
            <select id="seletorFuncao" class="mt-1 min-w-[190px] rounded border border-gray-300 bg-white px-3 py-2 text-sm text-gray-800" onchange="filtrarFuncaoEscala()" disabled>
              <option value="">Todas as funções</option>
            </select>
          </label>
          <button id="btnImprimir" type="button" onclick="exportarPDF()" class="inline-flex items-center justify-center rounded bg-gray-800 px-4 py-2 text-sm font-semibold text-white hover:bg-gray-700">Gerar PDF</button>
          <button id="btnAtualizar" type="button" onclick="atualizarPaginaEscalas()" class="inline-flex min-w-[112px] items-center justify-center gap-2 rounded bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-700 disabled:cursor-wait disabled:opacity-70">
            <svg id="spinnerAtualizar" class="hidden h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
            <span id="textoBtnAtualizar">Atualizar</span>
          </button>
        </div>
      </div>
      <div id="legendaCores" class="mt-3 flex flex-wrap gap-2 text-xs"></div>
    </header>

    <section class="rounded-lg bg-white p-3 shadow-sm md:p-5">
      <div id="mensagem" class="py-10 text-center text-gray-500">Carregando...</div>
      <div id="areaTabela" class="tabela-wrap hidden">
        <table class="w-full border-collapse border border-gray-300 text-xs">
          <thead><tr id="cabecalho" class="bg-gray-800 text-white"></tr></thead>
          <tbody id="corpo"></tbody>
        </table>
      </div>

    </section>

    <footer class="py-5 text-center text-xs text-gray-500">Consulta da escala publicada pelo CCI</footer>
  </main>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwX4H9ATieL04h7vZJ6taBdNbgDzB8CoPaHahRj7rAXyArRod3GKlAGoyHmq06KEqGaeA/exec';

function escaparHTML(valor) {
  return String(valor ?? '').replace(/[&<>'"]/g, caractere => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  })[caractere]);
}

function formatarMesAno(mesAno) {
  if (!/^\d{4}-\d{2}$/.test(String(mesAno || ''))) return '';
  const [ano, mes] = mesAno.split('-').map(Number);
  return new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' })
    .format(new Date(ano, mes - 1, 1))
    .replace(/^./, letra => letra.toUpperCase());
}

function ehDiaVermelho(publicacao, ano, mes, dia) {
  const dataISO = `${ano}-${String(mes).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
  if (Array.isArray(publicacao.diasVermelhos)) return publicacao.diasVermelhos.includes(dataISO);
  const semana = new Date(ano, mes - 1, dia).getDay();
  return semana === 0 || semana === 6;
}

function renderizarLegenda(publicacao) {
  const mapa = new Map();
  Object.values(publicacao.cores || {}).forEach(dia => {
    Object.values(dia || {}).forEach(item => {
      if (item?.cor && item?.legenda) mapa.set(`${item.cor}|${item.legenda}`, /puxad/i.test(item.legenda) ? {...item, cor: '#fca5a5'} : item);
    });
  });
  document.getElementById('legendaCores').innerHTML = [...mapa.values()].map(item =>
    `<span class="inline-flex items-center gap-1 rounded border bg-white px-2 py-1"><span class="inline-block h-3 w-3 rounded border" style="background:${escaparHTML(item.cor)}"></span>${escaparHTML(item.legenda)}</span>`
  ).join('');
}

let publicacaoAtual = null;

function atualizarSeletorFuncoes(publicacao) {
  const seletor = document.getElementById('seletorFuncao');
  const funcoes = (publicacao?.estrutura?.funcoes || []).filter((funcao, indice, lista) =>
    lista.indexOf(funcao) === indice && Number(publicacao.estrutura?.vagas?.[funcao] || 0) > 0
  );
  seletor.innerHTML = '<option value="">Todas as funções</option>' +
    funcoes.map((funcao, indice) => `<option value="${indice + 1}">${escaparHTML(funcao)}</option>`).join('');
  seletor.disabled = !funcoes.length;
  seletor.value = '';
}

function atualizarSeletorDias(publicacao) {
  const seletor = document.getElementById('seletorDia');
  const selecionado = seletor.value;
  if (!publicacao?.mesAno) {
    seletor.innerHTML = '<option value="">Mês completo</option>';
    seletor.disabled = true;
    return;
  }
  const [ano, mes] = publicacao.mesAno.split('-').map(Number);
  const qtd = new Date(ano, mes, 0).getDate();
  const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  seletor.innerHTML = '<option value="">Mês completo</option>' +
    Array.from({length: qtd}, (_, i) => {
      const dia = i + 1;
      return `<option value="${dia}">${String(dia).padStart(2, '0')}/${String(mes).padStart(2, '0')} — ${diasSemana[new Date(ano, mes - 1, dia).getDay()]}</option>`;
    }).join('');
  seletor.value = [...seletor.options].some(o => o.value === selecionado) ? selecionado : '';
  seletor.disabled = false;
}

function filtrarDiaEscala() {
  if (publicacaoAtual) renderizarEscala(publicacaoAtual);
}

function filtrarFuncaoEscala() {
  if (publicacaoAtual) renderizarEscala(publicacaoAtual);
}

function obterIdentificacaoMilitar(publicacao, dia, chave, vermelho) {
  const publicado = publicacao.dados?.[dia]?.[chave] || '';
  const nome = typeof publicado === 'object' ? (publicado.nome || '') : publicado;
  const saram = typeof publicado === 'object' ? (publicado.saram || '') : '';
  return nome
    ? `<span class="militar-nome${vermelho ? ' escala-vermelha' : ''}">${escaparHTML(nome)}</span>${saram ? `<span class="militar-saram">SARAM: ${escaparHTML(saram)}</span>` : ''}`
    : '<span class="text-gray-400">Não preenchido</span>';
}

function renderizarEscala(publicacao) {
  const [ano, mes] = publicacao.mesAno.split('-').map(Number);
  const diasNoMes = new Date(ano, mes, 0).getDate();
  const estrutura = publicacao.estrutura || { funcoes: [], vagas: {} };
  const colunas = [];
  const diaSelecionado = Number(document.getElementById('seletorDia').value || 0);
  const indiceSelecionado = diaSelecionado ? 0 : Number(document.getElementById('seletorFuncao').value || 0);
  const seletorFuncao = document.getElementById('seletorFuncao');
  seletorFuncao.disabled = !!diaSelecionado || !(publicacao.estrutura?.funcoes || []).length;
  seletorFuncao.title = diaSelecionado ? 'A visualização por dia sempre exibe toda a equipe.' : '';
  const funcoesDisponiveis = (estrutura.funcoes || []).filter((funcao, indice, lista) =>
    lista.indexOf(funcao) === indice && Number(estrutura.vagas?.[funcao] || 0) > 0
  );
  const funcaoSelecionada = indiceSelecionado > 0 ? funcoesDisponiveis[indiceSelecionado - 1] : null;
  (estrutura.funcoes || []).forEach(funcao => {
    if (funcaoSelecionada && funcao !== funcaoSelecionada) return;
    const qtd = Number(estrutura.vagas?.[funcao] || 0);
    for (let i = 0; i < qtd; i++) colunas.push({ funcao, chave: `${funcao} #${i + 1}` });
  });

  const tabela = document.querySelector('#areaTabela table');
  if (diaSelecionado >= 1 && diaSelecionado <= diasNoMes) {
    tabela.classList.add('tabela-dia');
    const vermelho = ehDiaVermelho(publicacao, ano, mes, diaSelecionado);
    const diaSemana = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'][new Date(ano, mes - 1, diaSelecionado).getDay()];
    document.getElementById('cabecalho').innerHTML = `<th class="border border-gray-300 p-3 text-left" style="width:38%">Função</th><th class="border border-gray-300 p-3 text-center">${escaparHTML(diaSemana)} — ${String(diaSelecionado).padStart(2, '0')}/${String(mes).padStart(2, '0')}/${ano}</th>`;
    document.getElementById('corpo').innerHTML = colunas.map(col => {
      const corOriginal = publicacao.cores?.[diaSelecionado]?.[col.chave]?.cor || '';
      const cor = /puxad/i.test(publicacao.cores?.[diaSelecionado]?.[col.chave]?.legenda || '') ? '#fca5a5' : corOriginal;
      const estilo = cor ? ` style="background-color:${escaparHTML(cor)}"` : '';
      return `<tr><td class="border border-gray-300 p-3 font-semibold">${escaparHTML(col.funcao)}</td><td class="celula-militar border border-gray-300 p-3 text-center"${estilo}>${obterIdentificacaoMilitar(publicacao, diaSelecionado, col.chave, vermelho)}</td></tr>`;
    }).join('');
    renderizarLegenda(publicacao);
    return;
  }
  tabela.classList.remove('tabela-dia');
  document.getElementById('cabecalho').innerHTML =
    '<th class="border border-gray-300 p-2">Dia</th><th class="border border-gray-300 p-2">Sem.</th>' +
    colunas.map(col => `<th class="border border-gray-300 p-2">${escaparHTML(col.funcao)}</th>`).join('');

  const nomesDias = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  let html = '';
  for (let dia = 1; dia <= diasNoMes; dia++) {
    const vermelho = ehDiaVermelho(publicacao, ano, mes, dia);
    html += `<tr class="${vermelho ? 'bg-amber-50' : ''}">`;
    html += `<td class="border p-2 text-center font-bold">${dia}</td>`;
    html += `<td class="border p-2 text-center font-semibold ${vermelho ? 'text-red-600' : 'text-gray-600'}">${nomesDias[new Date(ano, mes - 1, dia).getDay()]}</td>`;
    colunas.forEach(col => {
      const militarPublicado = publicacao.dados?.[dia]?.[col.chave] || '';
      // Compatibilidade com publicações antigas, que armazenavam apenas o nome.
      const nome = typeof militarPublicado === 'object' ? (militarPublicado.nome || '') : militarPublicado;
      const saram = typeof militarPublicado === 'object' ? (militarPublicado.saram || '') : '';
      const corOriginal = publicacao.cores?.[dia]?.[col.chave]?.cor || '';
      const cor = /puxad/i.test(publicacao.cores?.[dia]?.[col.chave]?.legenda || '') ? '#fca5a5' : corOriginal;
      const estilo = cor ? ` style="background-color:${escaparHTML(cor)}"` : '';
      const identificacao = nome
        ? `<span class="militar-nome${vermelho ? ' escala-vermelha' : ''}">${escaparHTML(nome)}</span>${saram ? `<span class="militar-saram">SARAM: ${escaparHTML(saram)}</span>` : ''}`
        : '';
      html += `<td class="celula-militar border p-2 text-center"${estilo}>${identificacao}</td>`;
    });
    html += '</tr>';
  }
  document.getElementById('corpo').innerHTML = html;
  renderizarLegenda(publicacao);
}

// Mesmo método do index.html: uma página PDF dimensionada pela escala inteira.
async function exportarPDF() {
  if (document.getElementById('areaTabela').classList.contains('hidden')) {
    alert('Aguarde o carregamento da escala.');
    return;
  }
  const botao = document.getElementById('btnImprimir');
  const rotulo = botao.textContent;
  botao.disabled = true;
  botao.textContent = 'Gerando PDF...';
  const areaMedicao = document.createElement('div');
  areaMedicao.style.cssText = 'position:fixed;left:0;top:0;z-index:-1;pointer-events:none;overflow:visible;background:#fff;padding:0;';
  try {
    if (!window.html2canvas || !window.jspdf?.jsPDF) throw new Error('Bibliotecas de PDF indisponíveis.');
    const copia = document.createElement('div');
    copia.className = 'pdf-exportacao';
    copia.style.cssText = 'display:inline-block;width:max-content;background:white;padding:0;margin:0;font-family:Arial,sans-serif;color:#1f2937;';
    const titulo = document.createElement('div');
    titulo.style.cssText = 'padding:8px 4px;font-size:20px;font-weight:bold;color:#b91c1c;';
    titulo.textContent = 'Escala de Serviço - CCI — ' + document.getElementById('mesPublicacao').textContent;
    copia.appendChild(titulo);
    const tabela = document.querySelector('#areaTabela table').cloneNode(true);
    tabela.style.cssText = tabela.classList.contains('tabela-dia') ? 'width:780px;min-width:780px;border-collapse:collapse;' : 'width:max-content;min-width:max-content;border-collapse:collapse;';
    copia.appendChild(tabela);
    areaMedicao.appendChild(copia);
    document.body.appendChild(areaMedicao);
    const larguraPagina = Math.ceil(Math.max(copia.scrollWidth, tabela.scrollWidth));
    const alturaPagina = Math.ceil(copia.scrollHeight);
    const canvas = await html2canvas(copia, {
      scale: 2, useCORS: true, scrollX: 0, scrollY: 0,
      width: larguraPagina, height: alturaPagina,
      windowWidth: larguraPagina, windowHeight: alturaPagina
    });
    const larguraPt = larguraPagina * 0.75;
    const alturaPt = alturaPagina * 0.75;
    const pdf = new window.jspdf.jsPDF({
      unit: 'pt', format: [larguraPt, alturaPt],
      orientation: larguraPt >= alturaPt ? 'landscape' : 'portrait', compress: true
    });
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.98), 'JPEG', 0, 0, larguraPt, alturaPt);
    pdf.save('Escala_CCI_' + (document.getElementById('seletorEscala').value || 'publicada') + (document.getElementById('seletorDia').value ? '_dia_' + document.getElementById('seletorDia').value.padStart(2, '0') : '') + '.pdf');
  } catch (erro) {
    console.error('Erro ao gerar PDF:', erro);
    alert('Não foi possível gerar o PDF. Verifique sua conexão e tente novamente.');
  } finally {
    areaMedicao.remove();
    botao.disabled = false;
    botao.textContent = rotulo;
  }
}

async function chamarApiPublica(funcao, params = {}) {
  const resposta = await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ funcao, params })
  });
  if (!resposta.ok) throw new Error('HTTP ' + resposta.status);
  const envelope = await resposta.json();
  if (!envelope.sucesso) throw new Error(envelope.erro || 'Erro ao consultar as escalas.');
  return envelope.dados;
}

function obterMesAtual() {
  const agora = new Date();
  return `${agora.getFullYear()}-${String(agora.getMonth() + 1).padStart(2, '0')}`;
}

async function carregarListaEscalasPublicadas(mesPreferido = '') {
  const seletor = document.getElementById('seletorEscala');
  const resultado = await chamarApiPublica('listarEscalasPublicadas');
  // Organiza os meses em ordem cronológica (do mais antigo ao mais recente).
  const escalas = (Array.isArray(resultado?.escalas) ? resultado.escalas : [])
    .filter(item => /^\d{4}-\d{2}$/.test(String(item?.mesAno || '')))
    .sort((a, b) => a.mesAno.localeCompare(b.mesAno));

  if (!escalas.length) {
    seletor.innerHTML = '<option value="">Nenhuma escala publicada</option>';
    seletor.disabled = true;
    publicacaoAtual = null;
    atualizarSeletorFuncoes(null);
    atualizarSeletorDias(null);
    document.getElementById('areaTabela')?.classList.add('hidden');
    const corpo = document.getElementById('corpo');
    if (corpo) corpo.innerHTML = '';
    const legenda = document.getElementById('legendaCores');
    if (legenda) legenda.innerHTML = '';
    return '';
  }

  seletor.disabled = false;
  seletor.innerHTML = escalas.map(item =>
    `<option value="${escaparHTML(item.mesAno)}">${escaparHTML(formatarMesAno(item.mesAno))}</option>`
  ).join('');

  const mesesDisponiveis = new Set(escalas.map(item => item.mesAno));
  const mesAtual = obterMesAtual();

  // Na abertura, prioriza o mês atual. Ao atualizar, preserva a escolha do usuário.
  // Se o mês atual não estiver publicado, mostra o mês publicado mais recente.
  const escolhido =
    (mesPreferido && mesesDisponiveis.has(mesPreferido) && mesPreferido) ||
    (mesesDisponiveis.has(mesAtual) && mesAtual) ||
    escalas[escalas.length - 1].mesAno;

  seletor.value = escolhido;
  return escolhido;
}

async function carregarEscalaPublicada(mesAno = '') {
  const mensagem = document.getElementById('mensagem');
  const area = document.getElementById('areaTabela');
  mensagem.classList.remove('hidden');
  mensagem.textContent = 'Carregando escala...';
  area.classList.add('hidden');

  try {
    const publicacao = await chamarApiPublica(
      'carregarEscalaPublicada',
      mesAno ? { mesAno } : {}
    );

    if (!publicacao?.publicada) {
      mensagem.textContent = 'Nenhuma escala foi publicada até o momento.';
      publicacaoAtual = null;
      atualizarSeletorFuncoes(null);
    atualizarSeletorDias(null);
      document.getElementById('mesPublicacao').textContent = 'Escala ainda não publicada';
      document.getElementById('ultimaAtualizacao').textContent = '';
      return;
    }

    const seletor = document.getElementById('seletorEscala');
    if (seletor && [...seletor.options].some(opcao => opcao.value === publicacao.mesAno)) {
      seletor.value = publicacao.mesAno;
    }

    document.getElementById('mesPublicacao').textContent = formatarMesAno(publicacao.mesAno);
    document.getElementById('ultimaAtualizacao').textContent =
      'Última publicação deste mês: ' + new Date(publicacao.publicadoEm).toLocaleString('pt-BR');

    publicacaoAtual = publicacao;
    atualizarSeletorFuncoes(publicacao);
    atualizarSeletorDias(publicacao);
    renderizarEscala(publicacao);
    mensagem.classList.add('hidden');
    area.classList.remove('hidden');
  } catch (erro) {
    console.error(erro);
    mensagem.textContent = 'Não foi possível carregar a escala publicada. Tente novamente.';
  }
}

async function atualizarPaginaEscalas() {
  const botao = document.getElementById('btnAtualizar');
  const spinner = document.getElementById('spinnerAtualizar');
  const texto = document.getElementById('textoBtnAtualizar');

  if (botao?.disabled) return;

  if (botao) botao.disabled = true;
  if (spinner) spinner.classList.remove('hidden');
  if (texto) texto.textContent = 'Carregando';

  try {
    const mesSelecionado = document.getElementById('seletorEscala')?.value || '';
    const escolhido = await carregarListaEscalasPublicadas(mesSelecionado);
    if (escolhido) {
      await carregarEscalaPublicada(escolhido);
    } else {
      document.getElementById('mensagem').classList.remove('hidden');
      document.getElementById('mensagem').textContent = 'Nenhuma escala foi publicada até o momento.';
      document.getElementById('mesPublicacao').textContent = 'Escala ainda não publicada';
      document.getElementById('ultimaAtualizacao').textContent = '';
    }
  } catch (erro) {
    console.error(erro);
    document.getElementById('mensagem').textContent =
      'Não foi possível atualizar a lista de escalas publicadas.';
  } finally {
    if (spinner) spinner.classList.add('hidden');
    if (texto) texto.textContent = 'Atualizar';
    if (botao) botao.disabled = false;
  }
}

async function iniciarVisualizacao() {
  const mensagem = document.getElementById('mensagem');
  try {
    const escolhido = await carregarListaEscalasPublicadas();
    if (escolhido) {
      await carregarEscalaPublicada(escolhido);
    } else {
      mensagem.textContent = 'Nenhuma escala foi publicada até o momento.';
      document.getElementById('mesPublicacao').textContent = 'Escala ainda não publicada';
    }
  } catch (erro) {
    console.error(erro);
    mensagem.textContent = 'Não foi possível carregar as escalas publicadas.';
  }
}

window.addEventListener('load', iniciarVisualizacao);
</script>
</body>
</html>
